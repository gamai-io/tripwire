[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamai-tripwire"
version = "0.8.9"
description = "Detect an inbound AI agent by behaviour, not blocklists: planted canaries, spec-derived novel paths, tool switching, key probing."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Renato Šuster", email = "renato@gamatrade.ba"}]
keywords = ["ai-agents", "security", "detection", "canary", "honeytoken", "access-log"]
dependencies = ["gama-mandate>=0.43"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://gamai.io/tripwire.html"
Repository = "https://github.com/gamai-io/tripwire"
Issues = "https://github.com/gamai-io/tripwire/issues"
Changelog = "https://github.com/gamai-io/tripwire/blob/main/CHANGELOG.md"

[project.scripts]
tripwire = "tripwire.cli:main"
gamai-tripwire = "tripwire.cli:main"

[tool.setuptools]
packages = ["tripwire"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
