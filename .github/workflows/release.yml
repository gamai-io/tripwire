name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the built artifacts to PyPI (trusted publishing)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --upgrade pip build twine ruff pytest
      - name: Install
        run: python -m pip install -e .
      - name: Lint
        run: ruff check .
      - name: Claims
        run: python3 tools/claims.py --check
      - name: Tests
        run: python -m pytest -q tests/
      - name: Build
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Pre-publish scan (no secrets, no internal paths)
        run: python3 tools/prepublish_scan.py dist/*.tar.gz dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    # a tag publishes after the build job passed; dispatch can also publish
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          # no token: the publisher entry added on PyPI trusts this repo+workflow
          skip-existing: true
          attestations: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist
      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: false
          overwrite_files: true
