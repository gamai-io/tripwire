name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . && python -m pip install pytest ruff build twine
      - name: Lint
        run: ruff check .
      - name: Claims (version, changelog, test count)
        run: python3 tools/claims.py --check
      - name: Tests
        run: python -m pytest -q tests/
      - name: Build and check
        run: python -m build && twine check dist/*
