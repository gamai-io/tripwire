name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . && python -m pip install pytest ruff build twine
      - name: Lint
        run: ruff check .
      - name: nginx (the deny-list parse test needs the real binary)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx-light
      - name: Claims (version, changelog, test count)
        run: python3 tools/claims.py --check
      - name: Tests
        run: python -m pytest -q tests/
      - name: Reproducible wheel (3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          rm -rf /tmp/r1 /tmp/r2
          SOURCE_DATE_EPOCH=1795600000 python -m build --outdir /tmp/r1 > /dev/null
          SOURCE_DATE_EPOCH=1795600000 python -m build --outdir /tmp/r2 > /dev/null
          SOURCE_DATE_EPOCH=1795600000 python3 tools/normalize_sdist.py /tmp/r1/*.tar.gz /tmp/r2/*.tar.gz > /dev/null
          cmp /tmp/r1/*.whl /tmp/r2/*.whl
          cmp /tmp/r1/*.tar.gz /tmp/r2/*.tar.gz
          echo "wheel and sdist are reproducible with SOURCE_DATE_EPOCH"
      - name: Build and check
        run: python -m build && twine check dist/*
      - name: Install the wheel and run the CLI
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/whl
          /tmp/whl/bin/pip install -q dist/*.whl gama-mandate
          /tmp/whl/bin/tripwire --help > /dev/null
          /tmp/whl/bin/python -c "import tripwire; print('wheel', tripwire.__version__)"
